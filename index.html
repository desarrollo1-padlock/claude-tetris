<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar a modo claro" title="Cambiar tema">🌙</button>
    <h1 class="game-title">TETRIS</h1>

    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box start-box">
        <p class="start-title">TETRIS</p>
        <div id="start-highscores" class="highscores"></div>
        <p id="start-best-combo" class="start-stat"></p>
        <p id="start-best-lines" class="start-stat"></p>
        <div class="start-actions">
          <button id="reset-scores-btn" type="button" class="secondary-btn">Reiniciar records</button>
          <button id="play-btn" type="button">JUGAR</button>
        </div>
      </div>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <p id="overlay-combo"></p>
        <p id="overlay-lines"></p>
        <div id="highscore-form" class="highscore-form hidden">
          <input id="highscore-name" type="text" maxlength="12" placeholder="Jugador" autocomplete="off" />
          <button id="save-highscore-btn" type="button">Guardar</button>
        </div>
        <div id="overlay-highscores" class="highscores"></div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
